spring.application.name=miapi
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bd_miapi

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT: clave externa de al menos 32 bytes
app.jwt.secret=ClaveJWTSuperSeguraParaClasesDuoc2026Ejemplo123456
app.jwt.expiration-minutes=30
app.jwt.issuer=auth-duoc

# Administrador de prueba
demo.admin.email=admin@duoc.cl
demo.admin.password=1234

# Direccion para Swagger
springdoc.swagger-ui.path=/swagger-ui.html
